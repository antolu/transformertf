# lightning.pytorch==2.2.1
seed_everything: true
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null
  max_epochs: 100
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  use_distributed_sampler: false
ckpt_path: null
lr_scheduler:
  class_path: torch.optim.lr_scheduler.StepLR
  init_args:
    step_size: 10
    gamma: 0.1
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.001
    weight_decay: 1e-4
model:
  class_path: transformertf.models.timexer.TimeXer
  init_args:
    d_model: 128
    num_heads: 8
    num_layers: 3
    patch_len: 16
    d_ff: 256
    dropout: 0.1
    use_norm: true
    compile_model: false
data:
  class_path: transformertf.data.EncoderDecoderDataModule
  init_args:
    known_covariates:
      - "I_meas_A"
    target_covariate: "B_meas_T"
    train_df_paths:
      - "path/to/train.parquet"
    val_df_paths:
      - "path/to/val.parquet"
    normalize: true
    ctxt_seq_len: 512
    tgt_seq_len: 128
    randomize_seq_len: false
    stride: 1
    downsample: 1
    batch_size: 16
    num_workers: 4
    dtype: float32
    distributed_sampler: false
